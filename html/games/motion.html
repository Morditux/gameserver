<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="description" content="MOTION — Showreel de motion design de 20 secondes : 100 % Canvas 2D, musique synthétisée en WebAudio, zéro dépendance."/>
<title>Motion — Showreel 20 s</title>
<style>
  * { box-sizing: border-box; }
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:#eaf6ff;
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;}
  #stage{position:fixed;inset:0;display:grid;place-items:center;}
  canvas{display:block;touch-action:none;box-shadow:0 0 90px rgba(0,240,255,.10);}

  /* ---------- Écran d'accueil ---------- */
  #start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;text-align:center;padding:24px;background:rgba(4,5,12,.72);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:opacity .5s;}
  #start.gone{opacity:0;pointer-events:none;}
  #start h1{margin:0;font-size:clamp(46px,10vw,124px);font-weight:900;letter-spacing:.06em;line-height:.95;
    background:linear-gradient(100deg,#00f0ff,#7a5cff 45%,#ff2bd6);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 28px rgba(122,92,255,.55));}
  #start p{margin:0;color:#9fb4d8;letter-spacing:.22em;text-transform:uppercase;font-size:clamp(11px,1.6vw,15px);}
  #start .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:10px;}
  #start small{color:#6a7898;font-size:12px;max-width:440px;line-height:1.5;}
  .cta{cursor:pointer;border:0;border-radius:999px;padding:16px 34px;font:700 16px/1 inherit;letter-spacing:.08em;
    color:#05060d;background:linear-gradient(100deg,#00f0ff,#b6ff3b);box-shadow:0 0 34px rgba(0,240,255,.45);
    transition:transform .15s,box-shadow .15s;}
  .cta:hover{transform:scale(1.05);box-shadow:0 0 50px rgba(0,240,255,.7);}
  .cta.alt{color:#cfe0ff;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);}

  /* ---------- Contrôles ---------- */
  #ui{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:center;gap:12px;
    padding:18px max(18px,env(safe-area-inset-left)) max(18px,env(safe-area-inset-bottom));
    background:linear-gradient(transparent,rgba(0,0,0,.78));transition:opacity .35s;}
  #ui.hide{opacity:0;pointer-events:none;}
  .btn{flex:none;min-width:44px;height:44px;padding:0 14px;display:grid;place-items:center;cursor:pointer;
    color:#eaf6ff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:12px;
    font:600 15px/1 inherit;letter-spacing:.04em;transition:background .15s,border-color .15s;}
  .btn:hover{background:rgba(0,240,255,.18);border-color:#00f0ff;}
  .btn.on{background:rgba(0,240,255,.22);border-color:#00f0ff;color:#00f0ff;}
  #bar{position:relative;flex:1;height:44px;cursor:pointer;touch-action:none;}
  #track{position:absolute;left:0;right:0;top:50%;height:5px;margin-top:-2.5px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden;}
  #fill{height:100%;width:0;background:linear-gradient(90deg,#00f0ff,#7a5cff,#ff2bd6);}
  #knob{position:absolute;top:50%;left:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#fff;
    box-shadow:0 0 14px #00f0ff;}
  .mark{position:absolute;top:50%;width:2px;height:13px;margin:-6.5px 0 0 -1px;background:rgba(255,255,255,.35);}
  #tc{flex:none;min-width:98px;font:600 14px/1 ui-monospace,Menlo,Consolas,monospace;color:#9fb4d8;text-align:right;}
  #rec{position:fixed;top:14px;right:16px;z-index:6;padding:6px 12px;border-radius:999px;font:700 12px/1 inherit;letter-spacing:.14em;
    color:#fff;background:rgba(255,40,80,.85);display:none;animation:blink 1s infinite;}
  #rec.on{display:block;}
  @keyframes blink{50%{opacity:.45;}}
  @media (max-width:640px){ #tc{display:none;} .btn.opt{display:none;} }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="rec">● REC</div>

<div id="start">
  <h1>MOTION</h1>
  <p>Showreel · 20 secondes · Canvas 2D · 0 dépendance</p>
  <div class="row">
    <button class="cta" id="goSound">▶ Lancer avec le son</button>
    <button class="cta alt" id="goSilent">Sans le son</button>
  </div>
  <small>Contient des flashs lumineux et des effets stroboscopiques. Espace : lecture/pause · ←/→ : ±1 s · M : son · F : plein écran.</small>
</div>

<div id="ui" class="hide">
  <button class="btn" id="bPlay" title="Lecture / pause (Espace)">⏸</button>
  <div id="bar"><div id="track"><div id="fill"></div></div><div id="knob"></div></div>
  <span id="tc">00:00:00</span>
  <button class="btn" id="bMute" title="Son (M)">🔊</button>
  <button class="btn opt" id="bLoop" title="Boucle (L)">⟲</button>
  <button class="btn opt" id="bRec" title="Exporter la vidéo en .webm 1080p">⏺ .webm</button>
  <button class="btn opt" id="bFs" title="Plein écran (F)">⛶</button>
</div>

<script>
(() => {
'use strict';

/* ============================================================
   MOTION — showreel de 20 s, 100 % piloté par une timeline.
   Chaque image est une fonction pure du temps t : on peut donc
   lire, mettre en pause, scrubber et exporter sans dérive.
   Repère virtuel 1920×1080, 120 BPM (1 temps = 0,5 s).
   ============================================================ */
const W = 1920, H = 1080, CX = W / 2, CY = H / 2, DUR = 20, BPM = 120, BEAT = 60 / BPM;
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;

/* ---------- Utilitaires ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const mod = (x, n) => ((x % n) + n) % n;
const hsl = (h, s, l, a = 1) => `hsla(${mod(h, 360)},${s}%,${l}%,${a})`;
const pulse = (t, k = 9) => Math.exp(-mod(t, BEAT) * k);      // impulsion calée sur le tempo
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const E = {
  out3: x => 1 - Math.pow(1 - x, 3),
  out5: x => 1 - Math.pow(1 - x, 5),
  in3: x => x * x * x,
  io3: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  io5: x => x < .5 ? 16 * Math.pow(x, 5) : 1 - Math.pow(-2 * x + 2, 5) / 2,
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  outBack: (x, s = 1.70158) => { const c = s + 1, y = x - 1; return 1 + c * y * y * y + s * y * y; },
  outElastic: x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (TAU / 3)) + 1,
  outBounce: x => { const n = 7.5625, d = 2.75;
    if (x < 1 / d) return n * x * x;
    if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75;
    if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375;
    return n * (x -= 2.625 / d) * x + .984375; }
};
const C = { bg: '#05060d', cy: '#00f0ff', mg: '#ff2bd6', ye: '#ffe14d', vi: '#7a5cff', li: '#b6ff3b', or: '#ff6a3d', wh: '#ffffff' };
const FONT = '"Arial Black","Helvetica Neue",Impact,system-ui,sans-serif';

/* ---------- État global ---------- */
let g, m, K = 1, gt = 0, dirty = true;       // g : contexte de la scène, m : contexte affiché
const cv = $('cv');
m = cv.getContext('2d', { alpha: false });
const sc = document.createElement('canvas');
let blur = [], chan = [], vig = null, grain = null;

/* ---------- Texte ---------- */
const LC = {};
function layout(str, px, track = 0, weight = 900, cache = true) {
  const font = `${weight} ${px}px ${FONT}`, key = cache ? str + '|' + font + '|' + track : null;
  if (key && LC[key]) return LC[key];
  g.save(); g.font = font;
  let x = 0; const items = [];
  for (const ch of str) { const w = g.measureText(ch).width; items.push({ ch, x, w }); x += w + track; }
  g.restore();
  const L = { items, width: x - track, font };
  if (key) LC[key] = L;
  return L;
}
function eachLetter(L, cx, cb) {
  const x0 = cx - L.width / 2;
  g.font = L.font; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  L.items.forEach((it, i) => cb(it, i, x0 + it.x));
}
function ghost(ch, x, y, dx, main = '#fff') {
  g.save(); g.globalCompositeOperation = 'lighter';
  g.fillStyle = C.cy; g.fillText(ch, x - dx, y);
  g.fillStyle = C.mg; g.fillText(ch, x + dx, y);
  g.restore(); g.fillStyle = main; g.fillText(ch, x, y);
}
function fillBG(c) { g.fillStyle = c; g.fillRect(0, 0, W, H); }
function rrect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function radial(x, y, r, stops) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  stops.forEach(([o, c]) => gr.addColorStop(o, c));
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
}

/* ============================================================
   SCÈNE 1 — GENÈSE (0 → 3 s)
   ============================================================ */
function sGenese(t) {
  fillBG(C.bg);
  // Grille de points parcourue par une onde à chaque seconde
  const k = clamp((t % 1) / 0.9), ringR = 1100 * E.out3(k), ga = prog(t, 0, 1);
  for (let y = 30; y < H; y += 60) for (let x = 30; x < W; x += 60) {
    const d = Math.hypot(x - CX, y - CY);
    const w = Math.max(0, 1 - Math.abs(d - ringR) / 150) * (1 - k);
    const r = (1.3 + 4 * w) * ga;
    g.fillStyle = w > .05 ? hsl(190, 100, 65, .5 + w) : 'rgba(140,160,255,.32)';
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  // Anneaux émis sur chaque temps
  for (let n = 0; n < 6; n++) {
    const age = t - n * BEAT; if (age < 0 || age > 1.4) continue;
    const p = age / 1.4;
    g.strokeStyle = hsl(190 + n * 28, 100, 60, (1 - p) * (1 - p) * .9);
    g.lineWidth = 2 + 12 * (1 - p);
    g.beginPath(); g.arc(CX, CY, 60 + 820 * E.out3(p), 0, TAU); g.stroke();
  }
  // Orbites de points
  const collapse = 1 - E.in3(prog(t, 2.35, 3));
  for (let o = 0; o < 3; o++) {
    const R = [250, 370, 500][o] * collapse, n = [8, 12, 16][o], dir = o % 2 ? -1 : 1;
    const app = prog(t, .3 + o * .18, 1.2 + o * .18), col = [C.cy, C.mg, C.ye][o];
    const a0 = dir * (t * (.9 + o * .25) + 3 * E.out3(prog(t, .3, 2.2)));
    g.save(); g.translate(CX, CY); g.rotate([-.35, .25, -.1][o]);
    g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 1.5; g.globalAlpha = app;
    g.beginPath(); g.ellipse(0, 0, R, R * .38, 0, 0, TAU); g.stroke(); g.globalAlpha = 1;
    for (let i = 0; i < n; i++) {
      const a = a0 + i / n * TAU, s = E.outBack(clamp(app * 1.4 - i / n * .4));
      const dep = (Math.sin(a) + 1) / 2;
      g.fillStyle = col; g.globalAlpha = .45 + .55 * dep;
      g.beginPath(); g.arc(Math.cos(a) * R, Math.sin(a) * R * .38, (4 + 8 * dep) * s, 0, TAU); g.fill();
    }
    g.restore();
  }
  // Deux lignes qui s'écartent et cadrent le titre
  const lp = E.outExpo(prog(t, .05, .95)), d = 175 * E.io3(prog(t, 1.25, 2.0)), half = 820 * lp;
  const lg = g.createLinearGradient(CX - half, 0, CX + half, 0);
  lg.addColorStop(0, 'rgba(0,240,255,0)'); lg.addColorStop(.25, C.cy); lg.addColorStop(.5, '#fff');
  lg.addColorStop(.75, C.mg); lg.addColorStop(1, 'rgba(255,43,214,0)');
  g.save(); g.strokeStyle = lg; g.lineWidth = 4; g.shadowColor = C.cy; g.shadowBlur = 24;
  for (const s of [-1, 1]) { g.beginPath(); g.moveTo(CX - half, CY + s * d); g.lineTo(CX + half, CY + s * d); g.stroke(); }
  g.restore();
  // Titre masqué par la bande entre les lignes
  if (t > 1.3) {
    const px = 270, L = layout('MOTION', px, 16), by = CY + .36 * px;
    g.save(); g.beginPath(); g.rect(0, CY - d + 8, W, 2 * d - 16); g.clip();
    eachLetter(L, CX, (it, i, x) => {
      const p = E.outExpo(prog(t, 1.35 + i * .06, 2.0 + i * .06));
      ghost(it.ch, x, by + (1 - p) * 340, 18 * (1 - E.out3(prog(t, 1.35, 2.5))) + 1.5);
    });
    g.restore();
    // Sous-titre : l'interlettrage se resserre
    const sp = E.out3(prog(t, 1.9, 2.7)), L2 = layout('SHOWREEL 2026 — CLAUDE', 34, lerp(60, 14, sp), 700, false);
    g.globalAlpha = prog(t, 1.9, 2.4); g.fillStyle = C.cy;
    eachLetter(L2, CX, (it, i, x) => g.fillText(it.ch, x, CY + d + 76));
    g.globalAlpha = 1;
  }
}

/* ============================================================
   SCÈNE 2 — TYPOGRAPHIE CINÉTIQUE (3 → 7 s)
   ============================================================ */
const WORDS = ['FORME', 'RYTHME', 'ÉNERGIE', 'IMPACT'];
const SPARKS = (() => { const r = rng(7); return Array.from({ length: 44 }, () => ({ a: r() * TAU, s: 260 + r() * 900, w: 2 + r() * 5 })); })();

function wordBG(w, v) {
  if (w === 0) {
    fillBG('#090b1e'); radial(CX, CY + 260, 1000, [[0, 'rgba(0,240,255,.22)'], [1, 'rgba(0,240,255,0)']]);
    g.strokeStyle = 'rgba(255,255,255,.05)'; g.lineWidth = 2;
    for (let y = mod(v * 90, 90); y < H; y += 90) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  } else if (w === 1) {
    fillBG(C.ye); g.save(); g.translate(CX, CY); g.rotate(-.5); g.fillStyle = 'rgba(0,0,0,.07)';
    for (let x = -1800 + mod(v * 140, 140); x < 1800; x += 140) g.fillRect(x, -1800, 60, 3600);
    g.restore();
  } else if (w === 2) {
    const gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, C.mg); gr.addColorStop(1, C.vi);
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(255,255,255,.10)';
    for (let k = 0; k < 28; k += 2) {
      const a = k / 28 * TAU + v * .35, a2 = (k + 1) / 28 * TAU + v * .35;
      g.beginPath(); g.moveTo(CX, CY); g.lineTo(CX + Math.cos(a) * 2400, CY + Math.sin(a) * 2400);
      g.lineTo(CX + Math.cos(a2) * 2400, CY + Math.sin(a2) * 2400); g.fill();
    }
  } else {
    fillBG('#05060d'); radial(CX, CY, 1100, [[0, 'rgba(255,106,61,.38)'], [.5, 'rgba(255,43,214,.10)'], [1, 'rgba(0,0,0,0)']]);
  }
  // Numéro géant en filigrane
  g.font = `900 980px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  g.lineWidth = 4; g.strokeStyle = w === 1 ? 'rgba(0,0,0,.14)' : 'rgba(255,255,255,.08)';
  g.strokeText('0' + (w + 1), CX + v * 60, CY + 350);
}
function wordText(w, v) {
  if (w === 0) {           // FORME — lettres qui tombent et rebondissent
    const px = 340, L = layout('FORME', px, 6), by = CY + .36 * px;
    g.fillStyle = 'rgba(255,255,255,.9)'; g.fillRect(CX - L.width / 2 * E.outExpo(prog(v, .5, .9)), by + 26, L.width * E.outExpo(prog(v, .5, .9)), 5);
    eachLetter(L, CX, (it, i, x) => {
      const p = prog(v, .04 + i * .07, .62 + i * .07);
      if (p <= 0) return;
      const y = by - (1 - E.outBounce(p)) * 900, cx = x + it.w / 2, rot = (1 - E.out3(p)) * (i % 2 ? .5 : -.5);
      for (let k = 3; k >= 1; k--) {
        g.save(); g.translate(cx, y - px * .3); g.rotate(rot); const s = 1 + .05 * k * (1 + 3 * pulse(gt));
        g.scale(s, s); g.strokeStyle = hsl(310 + k * 25, 100, 60, .32 / k * p); g.lineWidth = 3;
        g.strokeText(it.ch, -it.w / 2, px * .3); g.restore();
      }
      g.save(); g.translate(cx, y - px * .3); g.rotate(rot); g.fillStyle = C.cy; g.fillText(it.ch, -it.w / 2, px * .3); g.restore();
    });
  } else if (w === 1) {    // RYTHME — lettres élastiques qui dansent au tempo
    const px = 310, L = layout('RYTHME', px, 8), by = CY + .36 * px - 20;
    const bh = 96 * E.outExpo(prog(v, 0, .3));
    g.fillStyle = '#0a0a12'; g.fillRect(0, 0, W, bh); g.fillRect(0, H - bh, W, bh);
    eachLetter(L, CX, (it, i, x) => {
      const p = prog(v, .02 + i * .055, .42 + i * .055), e = E.outBack(p, 2.4);
      if (p <= 0) return;
      const jump = 30 * pulse(gt - i * .06, 8), cx = x + it.w / 2;
      g.save(); g.translate(cx, by - px * .3 - jump); g.rotate((1 - E.out3(p)) * (i % 2 ? 1 : -1));
      g.scale(e, e * (1 + .05 * pulse(gt - i * .06, 8))); g.fillStyle = '#0a0a12'; g.fillText(it.ch, -it.w / 2, px * .3); g.restore();
    });
    const dp = E.outBack(prog(v, .3, .65));
    for (let i = 0; i < 8; i++) {   // rangée de métronome
      const r = (12 + 22 * pulse(gt - i * BEAT / 4, 7)) * dp;
      g.fillStyle = '#0a0a12'; g.beginPath(); g.arc(CX - 350 + i * 100, CY + 260, r, 0, TAU); g.fill();
    }
  } else if (w === 2) {    // ÉNERGIE — le mot est découpé en tranches qui se rejoignent
    const px = 270, L = layout('ÉNERGIE', px, 4), by = CY + .36 * px, top = by - px * 1.02, bh = px * 1.08 / 8;
    for (let j = 0; j < 8; j++) {
      const dx = (j % 2 ? 1 : -1) * (1 - E.outExpo(prog(v, .02 + j * .02, .58))) * 1500;
      g.save(); g.beginPath(); g.rect(0, top + j * bh, W, bh + 1); g.clip(); g.translate(dx, 0); g.fillStyle = '#fff';
      eachLetter(L, CX, (it, i, x) => g.fillText(it.ch, x, by));
      g.restore();
    }
    const sp = prog(v, .5, 1.1);   // étincelles à l'assemblage
    if (sp > 0 && sp < 1) {
      g.strokeStyle = '#fff'; g.globalAlpha = 1 - sp;
      SPARKS.forEach(s => {
        const r0 = 250 * E.outExpo(sp) + 60, r1 = r0 + s.s * .14 * (1 - sp) + 10; g.lineWidth = s.w * (1 - sp) + .5;
        g.beginPath(); g.moveTo(CX + Math.cos(s.a) * r0 * 1.7, CY + Math.sin(s.a) * r0 * .9);
        g.lineTo(CX + Math.cos(s.a) * (r0 + s.s * E.outExpo(sp) * .45) * 1.7, CY + Math.sin(s.a) * (r0 + s.s * E.outExpo(sp) * .45) * .9); g.stroke();
      });
      g.globalAlpha = 1;
    }
  } else {                 // IMPACT — zoom brutal, onde de choc, tremblement
    const px = 340, L = layout('IMPACT', px, 4), by = CY + .36 * px;
    for (let k = 0; k < 36; k++) {
      const a = k / 36 * TAU + (k * 37 % 5) * .02, r0 = lerp(200, 620, E.outExpo(prog(v, .12, .6))) + (k % 4) * 30;
      const len = 260 + (k * 37 % 5) * 110;
      g.strokeStyle = k % 3 ? C.or : '#fff'; g.globalAlpha = 1 - prog(v, .3, .9); g.lineWidth = 4 + (k % 3) * 3;
      g.beginPath(); g.moveTo(CX + Math.cos(a) * r0, CY + Math.sin(a) * r0);
      g.lineTo(CX + Math.cos(a) * (r0 + len * E.outExpo(prog(v, .12, .5))), CY + Math.sin(a) * (r0 + len * E.outExpo(prog(v, .12, .5)))); g.stroke();
    }
    g.globalAlpha = 1;
    const sp = prog(v, .2, .95);
    if (sp > 0 && sp < 1) { g.strokeStyle = '#fff'; g.globalAlpha = 1 - sp; g.lineWidth = 46 * (1 - sp) + 2;
      g.beginPath(); g.arc(CX, CY, E.outExpo(sp) * 1500, 0, TAU); g.stroke(); g.globalAlpha = 1; }
    const p = E.outExpo(prog(v, 0, .28)), s = lerp(4.5, 1, p), A = 30 * Math.exp(-v * 9);

  pluck(w, f, v = 1, snd = .3) { const c = A.ctx, o = c.createOscillator(), o2 = c.createOscillator(), lp = c.createBiquadFilter();
    o.type = 'sawtooth'; o2.type = 'square'; o.frequency.value = f; o2.frequency.value = f * 1.004; lp.type = 'lowpass';
    lp.frequency.setValueAtTime(4200, w); lp.frequency.exponentialRampToValueAtTime(500, w + .2); o.connect(lp); o2.connect(lp);
    const gn = V.env(lp, w, .003, v * .12, .2); gn.connect(A.bus); V.send(gn, snd); o.start(w); o2.start(w); o.stop(w + .3); o2.stop(w + .3); },
  pad(w, notes, len, v = 1) { const c = A.ctx; notes.forEach(f => [-7, 7].forEach(dt => {
    const o = c.createOscillator(), lp = c.createBiquadFilter(), gn = c.createGain(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = dt;
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(500, w); lp.frequency.linearRampToValueAtTime(1500, w + len * .6);
    gn.gain.setValueAtTime(.0001, w); gn.gain.linearRampToValueAtTime(v * .028, w + .5); gn.gain.setValueAtTime(v * .028, w + len - .5); gn.gain.linearRampToValueAtTime(.0001, w + len);
    o.connect(lp); lp.connect(gn); gn.connect(A.bus); V.send(gn, .5); o.start(w); o.stop(w + len + .05); })); },
  riser(w, len, v = 1) { const c = A.ctx, s = V.noise(w, len + .05), f = c.createBiquadFilter(), gn = c.createGain(); f.type = 'bandpass'; f.Q.value = 2;
    f.frequency.setValueAtTime(300, w); f.frequency.exponentialRampToValueAtTime(7000, w + len);
    gn.gain.setValueAtTime(.0001, w); gn.gain.linearRampToValueAtTime(v * .45, w + len); gn.gain.linearRampToValueAtTime(0, w + len + .04);
    s.connect(f); f.connect(gn); gn.connect(A.bus); V.send(gn, .2); },
  boom(w, v = 1) { const c = A.ctx, o = c.createOscillator(); o.frequency.setValueAtTime(125, w); o.frequency.exponentialRampToValueAtTime(28, w + .9);
    V.env(o, w, .004, v, 1).connect(A.bus); o.start(w); o.stop(w + 1.1);
    const s = V.noise(w, 1.3), f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 3000; s.connect(f);
    const gn = V.env(f, w, .002, v * .45, 1.2); gn.connect(A.bus); V.send(gn, .4); },
  chime(w, f, v = 1) { const c = A.ctx; [1, 2.01, 3.98].forEach((r, i) => { const o = c.createOscillator(); o.frequency.value = f * r;
    const gn = V.env(o, w, .003, v * .14 / (i + 1), 1.5); gn.connect(A.bus); V.send(gn, .55); o.start(w); o.stop(w + 1.6); }); },
  blip(w, f, v = 1) { const o = A.ctx.createOscillator(); o.type = 'triangle'; o.frequency.setValueAtTime(f, w); o.frequency.exponentialRampToValueAtTime(f * 1.5, w + .06);
    const gn = V.env(o, w, .002, v * .12, .09); gn.connect(A.bus); V.send(gn, .3); o.start(w); o.stop(w + .12); }
};
(function buildTrack() {
  const CH = [{ r: 55, n: [220, 261.63, 329.63] }, { r: 43.65, n: [174.61, 220, 261.63] }, { r: 65.41, n: [261.63, 329.63, 392] }, { r: 49, n: [196, 246.94, 293.66] }];
  const PROG = [0, 1, 2, 3, 0, 1, 2, 3, 1, 0], chordAt = t => CH[PROG[Math.min(9, Math.floor(t / 2))]];
  for (let b = 0; b < 10; b++) at(b * 2, w => V.pad(w, CH[PROG[b]].n, 2.15, b === 9 ? 1.8 : 1));
  const drop = t => t >= 13 && t < 14.5;                     // respiration pendant les particules
  for (let k = 0; k < 40; k++) {
    const t = k * BEAT;
    if (t < 18.4 && !drop(t)) at(t, w => V.kick(w, t < 3 ? .6 : 1));
    if (t >= 3 && t < 18 && !drop(t) && k % 2) at(t, w => V.clap(w, 1));
    if (t >= 3 && t < 18 && !drop(t)) at(t + .25, w => V.hat(w, 1, true));
    if (t >= 10 && t < 13) [.125, .375].forEach(o => at(t + o, w => V.hat(w, .7)));
  }
  for (let k = 0; k < 72; k++) {
    const t = 3 + k * .25; if (t >= 18 || drop(t)) continue;
    const c = chordAt(t), hi = k % 2;
    at(t, w => V.bass(w, c.r * (hi ? 4 : 2), .2, hi ? .7 : 1));
  }
  const PAT = [0, 1, 2, 3, 2, 1, 2, 1];
  for (let k = 0; k < 160; k++) {
    const t = 7 + k * .125; if (t >= 18.5 || (t >= 13 && t < 14.5)) continue;
    const c = chordAt(t), notes = [c.n[0], c.n[1], c.n[2], c.n[0] * 2], f = notes[PAT[k % 8]] * (t >= 16 ? 2 : 1);
    at(t, w => V.pluck(w, f * 2, k % 8 === 0 ? 1.3 : 1, .28));
  }
  [[2, 1], [6, 1], [9, 1], [12, 1], [15, 1], [17.2, .8]].forEach(([t, len]) => at(t, w => V.riser(w, len, 1)));
  [3, 7, 10, 13, 16, 18].forEach(t => at(t, w => V.boom(w, t === 18 ? 1.1 : .85)));
  for (let k = 0; k < 8; k++) at(15.5 + k * .0625, w => V.clap(w, .4 + k * .1));       // roulement avant l'interface
  [[16, 880], [16.08, 1108.7], [16.16, 1318.5], [16.54, 1568], [16.6, 1760], [16.66, 1975.5], [16.72, 2093], [16.78, 2349], [16.84, 2637], [17.5, 1568]]
    .forEach(([t, f]) => at(t, w => V.blip(w, f, 1)));
  [[18.55, 880], [19.0, 1318.5], [19.25, 1760], [19.5, 2637]].forEach(([t, f]) => at(t, w => V.chime(w, f, 1)));
  at(13.5, w => V.chime(w, 659.25, .8)); at(14.0, w => V.chime(w, 987.77, .8)); at(14.5, w => V.chime(w, 1318.5, .8));
})();
A.start = function (from) {
  A.stop();
  const c = A.ctx, bus = A.bus = c.createGain(); bus.gain.value = .85; bus.connect(A.comp);
  const rv = A.rv = c.createGain(), cv2 = c.createConvolver(); cv2.buffer = A.ir; rv.gain.value = .55; rv.connect(cv2); cv2.connect(bus);
  const base = S.anchor - from;
  for (const [t, fn] of track) if (t >= from - .001) fn(base + t);
  const fs = base + 19.6; if (fs > c.currentTime) { bus.gain.setValueAtTime(.85, fs); bus.gain.linearRampToValueAtTime(0, base + 20.15); }
};
A.stop = function () {
  if (!A.bus) return;
  const b = A.bus, c = A.ctx; b.gain.cancelScheduledValues(0); b.gain.setTargetAtTime(0, c.currentTime, .015);
  setTimeout(() => b.disconnect(), 250); A.bus = null;
};

/* ============================================================
   Lecture, interface, export
   ============================================================ */
const S = { t: 0, from: 0, anchor: 0, playing: false, ended: false, muted: false, loop: false, rec: false };
const src = () => A.ctx ? A.ctx.currentTime : performance.now() / 1000;
const now = () => S.playing ? clamp(S.from + src() - S.anchor, S.from, DUR) : S.t;
function play(from) {
  S.from = clamp(from, 0, DUR - .001); S.playing = true; S.ended = false; S.anchor = src() + .06;
  if (A.ctx) { A.ctx.resume(); A.start(S.from); }
  syncBtns();
}
function pause() { S.t = now(); S.playing = false; A.stop(); syncBtns(); dirty = true; }
function seek(t) { t = clamp(t, 0, DUR - .001); if (S.playing) play(t); else { S.t = t; S.ended = false; dirty = true; } }
function ensureAudio() { if (initAudio()) { if (S.playing && !A.bus) play(now()); return true; } return false; }

const ui = $('ui'), fill = $('fill'), knob = $('knob'), tcEl = $('tc'), bar = $('bar');
function syncBtns() {
  $('bPlay').textContent = S.playing ? '⏸' : (S.ended ? '↻' : '▶');
  $('bMute').textContent = S.muted || !A.ctx ? '🔇' : '🔊';
  $('bLoop').classList.toggle('on', S.loop);
}
SC.slice(1, 7).forEach(t => { const d = document.createElement('div'); d.className = 'mark'; d.style.left = t / DUR * 100 + '%'; bar.appendChild(d); });
function updateUI(t) {
  const p = t / DUR * 100; fill.style.width = p + '%'; knob.style.left = p + '%';
  tcEl.textContent = `00:${String(Math.floor(t)).padStart(2, '0')}:${String(Math.floor(t * 30) % 30).padStart(2, '0')} / 00:20`;
}
function setMute(v) { S.muted = v; if (A.out) A.out.gain.setTargetAtTime(v ? 0 : 1, A.ctx.currentTime, .02); syncBtns(); }
function togglePlay() {
  if (S.playing) pause(); else if (S.ended || S.t >= DUR - .01) play(0); else play(S.t);
}

// Scrubbing
let drag = false, wasPlaying = false;
const seekFromEvent = e => { const r = bar.getBoundingClientRect(); seek(clamp((e.clientX - r.left) / r.width) * DUR); };
bar.addEventListener('pointerdown', e => { drag = true; wasPlaying = S.playing; bar.setPointerCapture(e.pointerId); if (S.playing) pause(); seekFromEvent(e); });
bar.addEventListener('pointermove', e => { if (drag) seekFromEvent(e); });
const endDrag = () => { if (!drag) return; drag = false; if (wasPlaying) play(S.t); };
bar.addEventListener('pointerup', endDrag); bar.addEventListener('pointercancel', endDrag);

$('bPlay').onclick = togglePlay;
$('bMute').onclick = () => { if (!A.ctx) { ensureAudio(); setMute(false); if (S.playing) play(now()); } else setMute(!S.muted); };
$('bLoop').onclick = () => { S.loop = !S.loop; syncBtns(); };
$('bFs').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); };
$('goSound').onclick = () => { ensureAudio(); $('start').classList.add('gone'); play(0); };
$('goSilent').onclick = () => { $('start').classList.add('gone'); play(0); };

// Export vidéo .webm (1080p, image + son)
let mr = null;
if (!window.MediaRecorder || !cv.captureStream) $('bRec').style.display = 'none';
$('bRec').onclick = () => {
  if (S.rec || !ensureAudio()) return;
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  S.rec = true; resize(); render(0);
  const stream = cv.captureStream(60); A.rec.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const chunks = []; mr = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 16e6 });
  mr.ondataavailable = e => e.data.size && chunks.push(e.data);
  mr.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); a.download = 'motion-showreel.webm'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000); };
  $('rec').classList.add('on'); mr.start(); play(0);
};
function finishRec() { if (!S.rec) return; setTimeout(() => { mr && mr.state !== 'inactive' && mr.stop(); }, 500); S.rec = false; $('rec').classList.remove('on'); setTimeout(resize, 700); }

// Clavier
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!$('start').classList.contains('gone')) return; togglePlay(); }
  else if (e.code === 'ArrowRight') seek(now() + (e.shiftKey ? .1 : 1));
  else if (e.code === 'ArrowLeft') seek(now() - (e.shiftKey ? .1 : 1));
  else if (e.code === 'Period' && !S.playing) seek(S.t + 1 / 30);
  else if (e.code === 'Comma' && !S.playing) seek(S.t - 1 / 30);
  else if (e.code === 'KeyR') play(0);
  else if (e.code === 'KeyM') $('bMute').click();
  else if (e.code === 'KeyL') $('bLoop').click();
  else if (e.code === 'KeyF') $('bFs').click();
  wake();
});
// Tap sur l'image = lecture/pause
cv.addEventListener('click', () => { if ($('start').classList.contains('gone')) togglePlay(); });

// Masquage automatique des contrôles
let idle = 0;
function wake() { ui.classList.remove('hide'); clearTimeout(idle); idle = setTimeout(() => { if (S.playing && !S.rec) ui.classList.add('hide'); }, 2600); }
['pointermove', 'pointerdown', 'touchstart'].forEach(ev => addEventListener(ev, wake, { passive: true }));

/* ---------- Boucle principale ---------- */
function tick() {
  requestAnimationFrame(tick);
  let t = now();
  if (S.playing && t >= DUR - .0005) {
    if (S.rec) finishRec();
    if (S.loop && !S.rec) { play(0); t = 0; }
    else { S.playing = false; S.ended = true; S.t = DUR - .0005; t = S.t; syncBtns(); ui.classList.remove('hide'); dirty = true; }
  }
  if (S.playing || dirty) { render(t); dirty = false; updateUI(t); }
}

/* ---------- Démarrage ---------- */
addEventListener('resize', resize);
resize(); makeGrain(); initParticles(); syncBtns();
const qt = parseFloat(new URLSearchParams(location.search).get('t'));
if (!isNaN(qt)) { $('start').style.display = 'none'; $('start').classList.add('gone'); S.t = clamp(qt, 0, DUR - .0005); }   // image fixe : ?t=5.4 (utile pour le débogage)
render(S.t); updateUI(S.t); requestAnimationFrame(tick);
})();
</script>
</body>
